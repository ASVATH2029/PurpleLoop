id: purpleloop-iam-access-key-creation

info:
  name: IAM Access Key Creation — Persistence via Long-Lived Credentials
  author: PurpleLoop
  severity: high
  description: |
    Simulates an attacker creating new IAM access keys for a user account after
    gaining elevated privileges.  This establishes persistent access that survives
    password resets and session revocation.  Commonly seen in post-compromise
    persistence phases.
  reference:
    - https://attack.mitre.org/techniques/T1098/001/
    - https://attack.mitre.org/techniques/T1136/003/
  tags: aws,iam,persistence,credential-access,cloudtrail
  metadata:
    mitre_attack:
      tactic: "TA0003 - Persistence"
      technique: "T1098.001 - Account Manipulation: Additional Cloud Credentials"
    purpleloop:
      attack_chain: iam-privesc
      variant: access-key-persist
      severity_score: 8.0

attack:
  type: aws-api
  steps:
    - action: iam:CreateAccessKey
      description: Create a new long-lived access key for persistent access
      parameters:
        UserName: "{{session_name}}"
      delay: "{{delay_seconds}}"
      cloudtrail_event:
        eventName: CreateAccessKey
        eventSource: iam.amazonaws.com
        sourceIPAddress: "{{source_ip}}"
        userAgent: "{{user_agent}}"
        requestParameters:
          userName: "{{session_name}}"
        responseElements:
          accessKey:
            accessKeyId: "AKIA{{random_hex_16}}"
            status: Active
            userName: "{{session_name}}"

    - action: iam:CreateLoginProfile
      description: Create console login for user that previously had API-only access
      parameters:
        UserName: "{{session_name}}"
        Password: "TempP@ss2024!"
        PasswordResetRequired: false
      delay: "{{delay_seconds}}"
      cloudtrail_event:
        eventName: CreateLoginProfile
        eventSource: iam.amazonaws.com
        sourceIPAddress: "{{source_ip}}"
        userAgent: "{{user_agent}}"
        requestParameters:
          userName: "{{session_name}}"
          passwordResetRequired: false

matchers:
  - type: cloudtrail
    name: access-key-created
    condition: or
    fields:
      - eventName == "CreateAccessKey"
      - eventName == "CreateLoginProfile"

extractors:
  - type: json
    name: new-access-key-id
    json:
      - ".responseElements.accessKey.accessKeyId"

variables:
  delay_seconds: "2"
  source_ip: "198.51.100.42"
  user_agent: "aws-cli/2.15.0 Python/3.11.6 Linux/5.15.0"
  session_name: "red-team-sim"
  target_account: "123456789012"
  random_hex_16: "4D45544152414E44"
